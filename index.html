<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ТребаСвітло?</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ТребаСвітло?">
<meta name="theme-color" content="#7c5cd6">
<style>
:root{--bg:#f4f1fb;--card:#fff;--tx:#1f1b2e;--mu:#6f6a86;--ac:#7c5cd6;--on:#2f9e5b;--off:#d9534f;--ln:#e6e1f4}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15121f;--card:#201c30;--tx:#f1eefb;--mu:#a29cc0;--ac:#a58cf2;--on:#4cc27f;--off:#ef7a76;--ln:#2e2942}}
:root[data-theme=dark]{--bg:#15121f;--card:#201c30;--tx:#f1eefb;--mu:#a29cc0;--ac:#a58cf2;--on:#4cc27f;--off:#ef7a76;--ln:#2e2942}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Nunito","Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}
.mu{color:var(--mu);font-size:14px}
.clock{font-size:56px;font-weight:800;letter-spacing:-1px;margin:8px 0 0}
.card{background:var(--card);border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 2px 14px rgba(80,50,160,.08)}
.st{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800}
.dot{width:14px;height:14px;border-radius:50%}
.on .dot{background:var(--on)}.off .dot{background:var(--off)}
.big{font-size:18px;margin:8px 0 2px}
.bar{height:10px;border-radius:6px;background:var(--ln);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:6px}
.on .bar i{background:var(--on)}.off .bar i{background:var(--off)}
.tabs{display:flex;gap:8px;margin:6px 0}
.tabs button,.btn{border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:700;background:var(--card);color:var(--tx);cursor:pointer}
.tabs button.a,.btn.p{background:var(--ac);color:#fff}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln);font-weight:700}
.row:last-child{border:0}
.row span:last-child{color:var(--off)}
.warn{background:#fff3cd;color:#664d03;border-radius:16px;padding:12px 14px;margin:10px 0;font-size:14px}
.bad{background:#fde2e1;color:#7a1f1c}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
.nav{display:flex;justify-content:space-between;align-items:center}
a{color:var(--ac)}
@media(min-width:900px){#app{max-width:760px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CITIES=[['Кривий Ріг','kr'],['Дніпро','dp'],['Кам’янське','kz']];
const QS=[];for(let i=1;i<=6;i++)for(let j=1;j<=2;j++)QS.push(i+'.'+j);
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let U=ld('ts_user'),D=ld('ts_data'),tab='today',view=U?'main':'set',err='';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

function kyiv(){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Kyiv',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return{date:p.year+'-'+p.month+'-'+p.day,min:+p.hour*60+ +p.minute,h:+p.hour};
}
function nextDate(d){const t=new Date(d+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+1);return t.toISOString().slice(0,10)}
const hm=m=>m===1440?'24:00':String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const dur=m=>{const h=Math.floor(m/60),n=m%60;return h?h+' год '+n+' хв':n+' хв'};

function info(day,exp){
  if(!day)return{st:'none',slots:[]};
  if(day.date&&day.date.slice(0,10)!==exp)return{st:'stale',slots:[],date:day.date.slice(0,10)};
  if(/Waiting/i.test(day.status||''))return{st:'wait',slots:[]};
  const slots=(day.slots||[]).map(s=>({s:s.start,e:s.end,p:s.type==='Possible'})).sort((a,b)=>a.s-b.s);
  return{st:'ok',slots,em:/Emergency/i.test(day.status||'')};
}

async function refresh(){
  if(!U)return;
  try{
    const r=await fetch('/api/schedule?city='+U.city+'&queue='+U.queue,{cache:'no-store'});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'Помилка');
    D=j;err='';sv('ts_data',D);
  }catch(e){err='Не вдалося оновити дані: '+e.message}
  render();
}

function card(t,n){
  const T=info(D&&D.today,t.date),M=info(D&&D.tomorrow,nextDate(t.date));
  if(T.st!=='ok')return '<div class="card"><div class="st">Немає актуальних даних</div><p class="mu">'+(T.st==='wait'?'Графік на сьогодні ще не опубліковано.':T.st==='stale'?'Джерело віддає застарілі дані за '+T.date+'.':'Дані ще не завантажено.')+' Перевір на сайті YASNO або ДТЕК.</p></div>';
  const cur=T.slots.find(x=>n>=x.s&&n<x.e);let off=!!cur,until,start,nx='';
  if(cur){
    until=cur.e;start=cur.s;
    if(cur.e>=1440&&M.st==='ok'&&M.slots[0]&&M.slots[0].s===0){until=1440+M.slots[0].e}
  }else{
    const f=T.slots.find(x=>x.s>n);
    if(f)until=f.s;else if(M.st==='ok'&&M.slots[0])until=1440+M.slots[0].s;else until=null;
    const pv=T.slots.filter(x=>x.e<=n).pop();start=pv?pv.e:0;
  }
  const cls=off?'off':'on';
  let h='<div class="card '+cls+'"><div class="st"><span class="dot"></span>'+(off?'Світла немає':'Світло є')+'</div>';
  if(until!=null){
    const tm=hm(until%1440)+(until>=1440?' (завтра)':'');
    h+='<div class="big">'+(off?'Увімкнуть о ':'Вимкнуть о ')+'<b>'+tm+'</b></div><div class="mu">Через '+dur(until-n)+'</div>';
    h+='<div class="bar"><i style="width:'+Math.max(0,Math.min(100,(n-start)/(until-start)*100))+'%"></i></div>';
  }else h+='<div class="big">Більше відключень не заплановано</div>';
  return h+'</div>';
}

function list(day,exp){
  const I=info(day,exp);
  if(I.st==='wait')return '<div class="card mu">Графік ще не опубліковано. Зазвичай з’являється ввечері.</div>';
  if(I.st!=='ok')return '<div class="card mu">Немає даних на цей день.</div>';
  if(!I.slots.length)return '<div class="card"><b>Відключень не заплановано</b></div>';
  const tot=I.slots.reduce((a,x)=>a+x.e-x.s,0);
  return '<div class="card">'+I.slots.map(x=>'<div class="row"><span>'+hm(x.s)+' – '+hm(x.e)+'</span><span>'+(x.p?'можливо':'немає світла')+'</span></div>').join('')+'</div><div class="mu">Разом без світла: '+dur(tot)+'</div>';
}

function render(){
  const a=$('app'),t=kyiv(),root=document.documentElement;
  if(U&&U.theme&&U.theme!=='auto')root.dataset.theme=U.theme;else delete root.dataset.theme;
  if(view==='set'){
    a.innerHTML='<div class="nav"><h1>'+(U?'Налаштування':'Вітаємо в ТребаСвітло?')+'</h1>'+(U?'<button class="btn" onclick="view=\'main\';render()">Назад</button>':'')+'</div>'+
    '<div class="card"><label>Ім’я</label><input id="n" maxlength="30" value="'+esc(U?U.name:'')+'">'+
    '<label>Місто</label><select id="c">'+CITIES.map(c=>'<option value="'+c[1]+'"'+(U&&U.city===c[1]?' selected':'')+'>'+c[0]+'</option>').join('')+'</select>'+
    '<label>Черга</label><select id="q">'+QS.map(q=>'<option'+(U&&U.queue===q?' selected':'')+'>'+q+'</option>').join('')+'</select>'+
    '<label>Тема</label><select id="th">'+[['auto','Авто'],['light','Світла'],['dark','Темна']].map(x=>'<option value="'+x[0]+'"'+((U&&U.theme||'auto')===x[0]?' selected':'')+'>'+x[1]+'</option>').join('')+'</select>'+
    '<p><button class="btn p" onclick="saveU()">Зберегти</button></p></div>'+
    (U?'<div class="card"><button class="btn" onclick="wipe()">Видалити мої дані</button></div>':'')+
    '<div class="card mu">Дані графіків: YASNO (відкритий API), оновлюються кожні кілька хвилин. Застосунок неофіційний; графіки можуть змінюватись — звіряйся з сайтом свого оператора. Розробник: Bohdan Savchenko · <a href="mailto:ssssssifo@gmail.com">ssssssifo@gmail.com</a></div>';
    return;
  }
  const n=t.min,g=t.h<5?'Доброї ночі 🌙':t.h<12?'Доброго ранку ☀️':t.h<18?'Доброго дня 🌤':'Доброго вечора 🌆';
  const cn=CITIES.find(c=>c[1]===U.city)[0];
  const day=tab==='today'?D&&D.today:D&&D.tomorrow,exp=tab==='today'?t.date:nextDate(t.date);
  const em=[D&&D.today,D&&D.tomorrow].some(d=>d&&/Emergency/i.test(d.status||''));
  let f='';
  if(D&&D.fetchedAt){f='Отримано з YASNO: '+new Date(D.fetchedAt).toLocaleString('uk-UA',{timeZone:'Europe/Kyiv',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    if(D.updatedOn)f+=' · оновлено джерелом: '+new Date(D.updatedOn).toLocaleString('uk-UA',{timeZone:'Europe/Kyiv',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
  a.innerHTML='<div class="nav"><div><div class="mu">'+esc(g+', '+U.name)+'</div><div class="mu">'+cn+' · черга '+U.queue+'</div></div><button class="btn" onclick="view=\'set\';render()">⚙︎</button></div>'+
  '<div class="clock">'+hm(n)+'</div>'+
  (err?'<div class="warn bad">'+esc(err)+'</div>':'')+
  (em?'<div class="warn">⚠️ Джерело повідомляє про аварійні відключення. Деталі — на сайті ДТЕК/YASNO.</div>':'')+
  card(t,n)+
  '<div class="tabs"><button class="'+(tab==='today'?'a':'')+'" onclick="tab=\'today\';render()">Сьогодні</button><button class="'+(tab==='tomorrow'?'a':'')+'" onclick="tab=\'tomorrow\';render()">Завтра</button></div>'+
  list(day,exp)+'<p class="mu">'+f+'</p><p><button class="btn" onclick="refresh()">Оновити</button></p>';
}
function saveU(){
  const n=$('n').value.trim();if(!n){$('n').focus();return}
  U={name:n,city:$('c').value,queue:$('q').value,theme:$('th').value};sv('ts_user',U);D=null;view='main';render();refresh();
}
function wipe(){if(confirm('Видалити всі дані з цього пристрою?')){try{localStorage.clear()}catch(e){}U=null;D=null;view='set';render()}}
render();refresh();
setInterval(()=>{if(view==='main')render()},30000);
setInterval(refresh,300000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
