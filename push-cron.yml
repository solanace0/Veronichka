name: push-cron
# Пінгує /api/push-cron кожні 5 хвилин. Задача навмисно НІКОЛИ не завершується помилкою:
# GitHub шле листи на пошту лише про «Run failed». Усі проблеми видно в журналі як ::warning::
# (Actions -> push-cron -> відкрити запуск).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: push-cron
  cancel-in-progress: false
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Ping /api/push-cron
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +e
          APP_URL=$(printf '%s' "$APP_URL" | tr -d '[:space:]')
          CRON_SECRET=$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Не задано secrets APP_URL і/або CRON_SECRET (Settings -> Secrets and variables -> Actions)"
            exit 0
          fi
          case "$APP_URL" in http*) ;; *) APP_URL="https://$APP_URL" ;; esac
          URL="${APP_URL%/}/api/push-cron"
          CODE=000
          for i in 1 2 3; do
            CODE=$(curl -sS -m 30 -o "$RUNNER_TEMP/resp.txt" -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$URL" 2>"$RUNNER_TEMP/curl.err")
            [ -z "$CODE" ] && CODE=000
            echo "спроба $i: HTTP $CODE"; head -c 600 "$RUNNER_TEMP/resp.txt" 2>/dev/null; echo; head -c 300 "$RUNNER_TEMP/curl.err" 2>/dev/null
            [ "$CODE" = "200" ] && exit 0
            [ "$CODE" = "401" ] && { echo "::warning::401: CRON_SECRET у GitHub не збігається з CRON_SECRET у Vercel"; exit 0; }
            [ "$CODE" = "503" ] && { echo "::warning::503: на Vercel не задані VAPID_* або Upstash (KV_REST_API_*)"; exit 0; }
            sleep 8
          done
          echo "::warning::Сервер не відповів 200 за 3 спроби (останній код $CODE). Наступний запуск через 5 хвилин."
          exit 0
