# Кожні 5 хвилин смикає /api/push-cron, який розсилає сповіщення.
# Потрібні секрети репозиторію: APP_URL (напр. https://veronichka.vercel.app) і CRON_SECRET (те саме значення, що у Vercel).
name: push-cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 30 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/push-cron"
