name: push-cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/push-cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Не заданы secrets APP_URL и/или CRON_SECRET (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          URL="${APP_URL%/}/api/push-cron"
          for i in 1 2 3; do
            CODE=$(curl -sS -m 40 -o resp.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$URL" || echo 000)
            echo "attempt $i: HTTP $CODE"; cat resp.txt 2>/dev/null; echo
            if [ "$CODE" = "200" ]; then exit 0; fi
            # 401/503 повтором не лечатся: неверный секрет или не настроен сервер
            if [ "$CODE" = "401" ]; then echo "::error::401 — CRON_SECRET в GitHub не совпадает с CRON_SECRET в Vercel"; exit 1; fi
            if [ "$CODE" = "503" ]; then echo "::error::503 — на Vercel не заданы VAPID_*/Upstash (KV_REST_API_*) переменные"; exit 1; fi
            sleep 8
          done
          echo "::error::Сервер не ответил 200 за 3 попытки (последний код $CODE)"
          exit 1
